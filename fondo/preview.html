<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fondo 3D · Fluid Motion</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #050308; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }

  /* scroll de prueba para ver el fade */
  #scroller { position: fixed; inset: 0; overflow-y: auto; z-index: 2; }
  #scroller .spacer { height: 260vh; }

  .hud {
    position: fixed; left: 22px; bottom: 18px; z-index: 5;
    font: 600 11px/1.6 'DM Sans', 'Segoe UI', system-ui, sans-serif;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: rgba(255,197,211,.65);
    pointer-events: none;
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div id="scroller"><div class="spacer"></div></div>
<div class="hud">fondo 3D · fluid motion · scroll para probar fade</div>

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const VIEWBOX = { w: 960, h: 1200 };
const LOOP = 24;            // segundos por ciclo (loop perfecto)
const W0 = (Math.PI * 2) / LOOP;

const data = await (await fetch('./fondo-data.json')).json();
const icons = data.icons;

/* ---------- renderer / scene / camera ---------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x050308, 1);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050308, 0.0022);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 6000);

/* ---------- luces (paleta: violeta #79547a + rosa #FFC5D3) ---------- */
scene.add(new THREE.AmbientLight(0x403048, 1.4));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(300, 250, 600);
scene.add(key);
const rim = new THREE.DirectionalLight(0xffc5d3, 0.9);
rim.position.set(-400, -200, 200);
scene.add(rim);
const pink = new THREE.PointLight(0xffc5d3, 700, 0, 1.6);
pink.position.set(-200, -150, 250);
scene.add(pink);
const violet = new THREE.PointLight(0x79547a, 500, 0, 1.6);
violet.position.set(250, 200, -100);
scene.add(violet);

/* ---------- materiales (compartidos) ---------- */
const matWhite = new THREE.MeshStandardMaterial({
  color: 0xffffff, roughness: 0.32, metalness: 0.12,
  emissive: 0xffc5d3, emissiveIntensity: 0.10
});
const matPurple = new THREE.MeshStandardMaterial({
  color: 0x996699, roughness: 0.42, metalness: 0.10,
  emissive: 0x79547a, emissiveIntensity: 0.20
});
function matFor(color) {
  const c = (color || '').toLowerCase();
  return (c === '#969' || c === '#996699') ? matPurple : matWhite;
}

/* ---------- construir objetos 3D ---------- */
const field = new THREE.Group();
const META = [];  // { mesh, bx, by, bz, phase, freq, rotAmp }

function polyToShape(pts) {
  const s = new THREE.Shape();
  s.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) s.lineTo(pts[i][0], pts[i][1]);
  s.closePath();
  return s;
}

// mapeo SVG (y-down) -> mundo (centro en 0, y-up)
const W2 = VIEWBOX.w / 2, H2 = VIEWBOX.h / 2;

// áreas para asignar profundidad por tamaño
const areas = icons.map(i => i.w * i.h).sort((a, b) => a - b);
function areaPct(a) {
  let lo = 0, hi = areas.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; (areas[m] < a) ? (lo = m + 1) : (hi = m); }
  return lo / (areas.length - 1 || 1);
}

for (let i = 0; i < icons.length; i++) {
  const ic = icons[i];
  const geoms = [];
  for (const poly of ic.polys) {
    if (poly.length < 3) continue;
    const shape = polyToShape(poly);
    const depth = THREE.MathUtils.clamp(Math.max(ic.w, ic.h) / 9, 2.5, 16);
    geoms.push(new THREE.ExtrudeGeometry(shape, {
      depth, bevelEnabled: true, bevelThickness: 1.2, bevelSize: 0.8, bevelSegments: 2
    }));
  }
  if (!geoms.length) continue;
  const geo = geoms.length === 1 ? geoms[0] : mergeGeometries(geoms, false);
  geo.computeVertexNormals();

  const mesh = new THREE.Mesh(geo, matFor(ic.color));

  // posición base (centro del icono en mundo)
  const bx = ic.cx - W2;
  const by = -(ic.cy - H2);
  const pct = areaPct(ic.w * ic.h);
  // profundidad: grandes más cerca (z positivo, hacia cámara)
  const bz = THREE.MathUtils.lerp(-220, 140, pct) + (Math.random() * 60 - 30);
  mesh.position.set(bx, by, bz);

  // rotación inicial sutil (base para la oscilación)
  const rx0 = Math.random() * 0.3 - 0.15;
  const ry0 = Math.random() * 0.3 - 0.15;
  mesh.rotation.x = rx0;
  mesh.rotation.y = ry0;

  field.add(mesh);
  META.push({
    mesh, bx, by, bz, rx0, ry0,
    phase: Math.random() * Math.PI * 2,
    freq: W0 * (1 + (Math.random() * 3 | 0)),   // 1..3 armónicos -> loop en LOOP
    rotAmp: 0.04 + Math.random() * 0.10,
    floatAmp: 3 + Math.random() * 8
  });
}
scene.add(field);
console.log('objetos renderizados:', META.length);

/* ---------- cámara y encuadre (cover del campo retrato en viewport landscape) ---------- */
const FOV = 45 * Math.PI / 180;
function fitCamera() {
  const aspect = window.innerWidth / window.innerHeight;
  // ancho del campo (960) llena el ancho del viewport
  const visW = VIEWBOX.w;
  const visH = visW / aspect;
  const dist = (visW / 2) / (Math.tan(FOV / 2) * aspect);
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
  camera.position.z = dist + 160;
  return { visH, dist };
}
let framing = fitCamera();

/* ---------- animación (fluida, loop perfecto) ---------- */
const drift = { x: 0, y: 0, z: 0 };
const mouse = { x: 0, y: 0 };
window.addEventListener('pointermove', (e) => {
  mouse.x = (e.clientX / window.innerWidth - 0.5) * 2;
  mouse.y = (e.clientY / window.innerHeight - 0.5) * 2;
});
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  framing = fitCamera();
});

const clock = new THREE.Clock();
let scrollFade = 1;
const scroller = document.getElementById('scroller');
scroller.addEventListener('scroll', () => {
  const max = scroller.scrollHeight - scroller.clientHeight;
  const p = max > 0 ? scroller.scrollTop / max : 0;
  scrollFade = THREE.MathUtils.clamp(1 - p * 1.6, 0, 1);
  renderer.domElement.style.opacity = String(scrollFade);
  renderer.domElement.style.transform = `scale(${1 - p * 0.10}) translateY(${-p * 30}px)`;
});

function animate() {
  const t = clock.getElapsedTime();

  // cámara: deriva fluida + respiración (todo periódico, loop en LOOP)
  const ampY = Math.max(0, (VIEWBOX.h - framing.visH) / 2) * 0.82;
  const ampX = 40;
  drift.x = ampX * Math.sin(W0 * t) + mouse.x * 24;
  drift.y = ampY * Math.sin(2 * W0 * t + 1.3) + mouse.y * -16;
  drift.z = 60 * Math.sin(3 * W0 * t + 0.5);

  camera.position.x = drift.x;
  camera.position.y = drift.y;
  camera.position.z = framing.dist + 160 + drift.z;
  camera.lookAt(0, 0, 0);

  // objetos: flotación + rotación sutil por fase (SET, no acumular -> loop perfecto)
  for (const o of META) {
    const w = o.freq;
    const ph = o.phase;
    o.mesh.position.y = o.by + o.floatAmp * Math.sin(w * t + ph);
    o.mesh.position.z = o.bz + o.floatAmp * 0.4 * Math.sin(w * t + ph + 1.7);
    o.mesh.rotation.x = o.rx0 + o.rotAmp * Math.sin(w * t + ph + 0.4);
    o.mesh.rotation.y = o.ry0 + o.rotAmp * Math.sin(w * t + ph + 2.1);
    o.mesh.rotation.z = o.rotAmp * 0.6 * Math.sin(w * t + ph + 0.9);
  }

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
