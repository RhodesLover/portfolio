<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fondo 3D · Fluid Motion</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #060309; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }

  #scroller { position: fixed; inset: 0; overflow-y: auto; z-index: 2; }
  #scroller .spacer { height: 260vh; }

  .hud {
    position: fixed; left: 22px; bottom: 18px; z-index: 5;
    font: 600 11px/1.6 'DM Sans', 'Segoe UI', system-ui, sans-serif;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: rgba(255,197,211,.65); pointer-events: none;
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div id="scroller"><div class="spacer"></div></div>
<div class="hud">fondo 3D · fluid motion · scroll para probar fade</div>

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const VIEWBOX = { w: 960, h: 1200 };
const LOOP = 26;              // segundos por ciclo (loop perfecto)
const W0 = (Math.PI * 2) / LOOP;

const data = await (await fetch('./fondo-data.json')).json();
const icons = data.icons;

/* ---------- renderer / scene / camera ---------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x060309, 1);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x060309, 0.0026);

// gradiente radial de fondo (violeta -> negro), pantalla completa
function makeGradient() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(256, 256, 0, 256, 256, 256);
  grad.addColorStop(0, '#201026');
  grad.addColorStop(0.5, '#120a18');
  grad.addColorStop(1, '#060309');
  g.fillStyle = grad; g.fillRect(0, 0, 512, 512);
  return new THREE.CanvasTexture(c);
}
scene.background = makeGradient();

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 6000);

/* ---------- luces ---------- */
scene.add(new THREE.AmbientLight(0x403048, 1.05));
const key = new THREE.DirectionalLight(0xffffff, 1.85);
key.position.set(300, 250, 600);
scene.add(key);
const rim = new THREE.DirectionalLight(0xffc5d3, 1.0);
rim.position.set(-400, -250, 200);
scene.add(rim);
const pink = new THREE.PointLight(0xffc5d3, 800, 0, 1.7);
scene.add(pink);
const violet = new THREE.PointLight(0x79547a, 600, 0, 1.7);
violet.position.set(250, 200, -120);
scene.add(violet);

/* ---------- materiales ---------- */
const matWhite = new THREE.MeshStandardMaterial({
  color: 0xffffff, roughness: 0.28, metalness: 0.22,
  emissive: 0xffc5d3, emissiveIntensity: 0.16
});
const matPurple = new THREE.MeshStandardMaterial({
  color: 0x996699, roughness: 0.36, metalness: 0.16,
  emissive: 0x79547a, emissiveIntensity: 0.30
});
function matFor(color) {
  return (color || '').toLowerCase() === '#969' || (color || '').toLowerCase() === '#996699' ? matPurple : matWhite;
}

/* ---------- construir objetos 3D ---------- */
const field = new THREE.Group();
const META = [];

function polyToShape(pts) {
  const s = new THREE.Shape();
  s.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) s.lineTo(pts[i][0], pts[i][1]);
  s.closePath();
  return s;
}

const W2 = VIEWBOX.w / 2, H2 = VIEWBOX.h / 2;
const areas = icons.map(i => i.w * i.h).sort((a, b) => a - b);
function areaPct(a) {
  let lo = 0, hi = areas.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; (areas[m] < a) ? (lo = m + 1) : (hi = m); }
  return lo / (areas.length - 1 || 1);
}

for (let i = 0; i < icons.length; i++) {
  const ic = icons[i];
  const geoms = [];
  for (const poly of ic.polys) {
    if (poly.length < 3) continue;
    const shape = polyToShape(poly);
    const depth = THREE.MathUtils.clamp(Math.max(ic.w, ic.h) / 9, 2.5, 16);
    geoms.push(new THREE.ExtrudeGeometry(shape, {
      depth, bevelEnabled: true, bevelThickness: 1.2, bevelSize: 0.8, bevelSegments: 2
    }));
  }
  if (!geoms.length) continue;
  const geo = geoms.length === 1 ? geoms[0] : mergeGeometries(geoms, false);
  geo.computeVertexNormals();

  const mesh = new THREE.Mesh(geo, matFor(ic.color));

  const bx = ic.cx - W2;
  const by = -(ic.cy - H2);
  const pct = areaPct(ic.w * ic.h);
  const bz = THREE.MathUtils.lerp(-240, 150, pct) + (Math.random() * 60 - 30);
  mesh.position.set(bx, by, bz);

  const rx0 = Math.random() * 0.35 - 0.17;
  const ry0 = Math.random() * 0.35 - 0.17;
  mesh.rotation.x = rx0;
  mesh.rotation.y = ry0;

  field.add(mesh);
  // movimiento orgánico: 2 armónicos por eje (todos múltiplos de W0 -> loop perfecto)
  META.push({
    mesh, bx, by, bz, rx0, ry0,
    p1: Math.random() * Math.PI * 2, p2: Math.random() * Math.PI * 2,
    k1: 1 + (Math.random() * 2 | 0), k2: 2 + (Math.random() * 3 | 0), k3: 3 + (Math.random() * 2 | 0),
    rotAmp: 0.05 + Math.random() * 0.12,
    floatAmp: 4 + Math.random() * 10
  });
}
scene.add(field);
console.log('objetos renderizados:', META.length);

/* ---------- post-procesado: bloom ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.55, 0.55, 0.75);
composer.addPass(bloom);

/* ---------- encuadre ---------- */
const FOV = 45 * Math.PI / 180;
let framing;
function fitCamera() {
  const aspect = window.innerWidth / window.innerHeight;
  const visW = VIEWBOX.w;
  const visH = visW / aspect;
  const dist = (visW / 2) / (Math.tan(FOV / 2) * aspect);
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
  camera.position.z = dist + 180;
  return { visH, dist };
}
framing = fitCamera();

/* ---------- interacción + animación ---------- */
const mouse = { x: 0, y: 0, sx: 0, sy: 0 };
window.addEventListener('pointermove', (e) => {
  mouse.x = (e.clientX / window.innerWidth - 0.5) * 2;
  mouse.y = (e.clientY / window.innerHeight - 0.5) * 2;
});
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  framing = fitCamera();
});

const clock = new THREE.Clock();
let scrollFade = 1;
const scroller = document.getElementById('scroller');
scroller.addEventListener('scroll', () => {
  const max = scroller.scrollHeight - scroller.clientHeight;
  const p = max > 0 ? scroller.scrollTop / max : 0;
  scrollFade = THREE.MathUtils.clamp(1 - p * 1.6, 0, 1);
  renderer.domElement.style.opacity = String(scrollFade);
  renderer.domElement.style.transform = `scale(${1 - p * 0.08}) translateY(${-p * 26}px)`;
});

function animate() {
  const t = clock.getElapsedTime();

  // cámara: deriva orgánica multi-armónica + respiración (todo periódico -> loop)
  const ampY = Math.max(0, (VIEWBOX.h - framing.visH) / 2) * 0.85;
  const ampX = 46;
  mouse.sx += (mouse.x - mouse.sx) * 0.05;
  mouse.sy += (mouse.y - mouse.sy) * 0.05;

  const camX = ampX * Math.sin(W0 * t) + 20 * Math.sin(3 * W0 * t + 1.1) + mouse.sx * 30;
  const camY = ampY * Math.sin(2 * W0 * t + 1.3) + 18 * Math.sin(W0 * t + 0.4) + mouse.sy * -20;
  const camZ = 50 * Math.sin(2 * W0 * t + 0.5);

  camera.position.set(camX, camY, framing.dist + 180 + camZ);
  camera.lookAt(0, 0, 0);

  // luz rosa en órbita suave (periódica -> loop)
  pink.position.set(300 * Math.sin(W0 * t + 0.7), 200 * Math.sin(2 * W0 * t + 1.9), 220 + 80 * Math.sin(W0 * t));

  // objetos: flotación + rotación orgánica (SET, no acumular)
  for (const o of META) {
    const y = o.by
      + o.floatAmp * Math.sin(o.k1 * W0 * t + o.p1)
      + o.floatAmp * 0.35 * Math.sin(o.k2 * W0 * t + o.p2);
    const z = o.bz + o.floatAmp * 0.45 * Math.sin(o.k2 * W0 * t + o.p2 + 1.7);
    o.mesh.position.y = y;
    o.mesh.position.z = z;
    o.mesh.rotation.x = o.rx0 + o.rotAmp * Math.sin(o.k1 * W0 * t + o.p1 + 0.4) + o.rotAmp * 0.5 * Math.sin(o.k3 * W0 * t + o.p2);
    o.mesh.rotation.y = o.ry0 + o.rotAmp * Math.sin(o.k2 * W0 * t + o.p2 + 2.1) + o.rotAmp * 0.5 * Math.sin(o.k1 * W0 * t + o.p1);
    o.mesh.rotation.z = o.rotAmp * 0.7 * Math.sin(o.k3 * W0 * t + o.p1 + 0.9);
  }

  composer.render();
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
